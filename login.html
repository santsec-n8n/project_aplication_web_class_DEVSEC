<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
   <meta charset="UTF-8"> 
   <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
   <title>Login</title> 
   <link rel="stylesheet" href="login.css"> 
</head> 
<body> 
   <div class="login-container"> 
       <h2>Login</h2> 
       <form action="login.php" method="POST"> 
           <div class="input-group"> 
               <label for="usuario">E-mail</label> 
               <input type="email" name="email" id="usuario" required> 
           </div> 
           <div class="input-group"> 
               <label for="senha">Senha</label> 
               <input type="password" name="senha" id="senha" required> 
           </div> 
           <button type="submit" class="btn">Entrar</button> 
           <p id="mensagem-erro" class="erro"></p>
       </form> 
   </div> 
   <!-- JavaScript para exibir a mensagem de erro -->
   <script>
       const parametros = new URLSearchParams(window.location.search);
       const erro = parametros.get('erro');

       if (erro) {
           document.getElementById('mensagem-erro').textContent = erro;
       }
   </script>
</body> 
</html>
